# docker compose -f deploy/docker-compose.yml up
# Four processes: web, worker, beat, plus postgres/redis.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casino_index
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    build: ..
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file: ../.env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ..
    command: celery -A config worker -l info --concurrency=4
    env_file: ../.env
    depends_on: [db, redis]

  beat:
    # The scheduler. One replica only, or the nightly job fires twice.
    build: ..
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ../.env
    depends_on: [db, redis]

volumes:
  pgdata:
