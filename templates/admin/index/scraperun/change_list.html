{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li>
    <form method="post" action="{% url 'admin:index_scraperun_run_all_now' %}" style="display:inline">
      {% csrf_token %}
      <select name="region" style="padding:6px;border-radius:4px;margin-right:6px">
        <option value="">All markets</option>
        {% for region in regions %}
          <option value="{{ region.code }}">{{ region.name }} ({{ region.code }})</option>
        {% endfor %}
      </select>
      <button type="submit" class="button"
              style="background:#059669;color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer"
              onclick="return confirm('Queue the full pipeline: discover new brands, then scrape games, for the selected market (or all markets if none is selected)?')">
        Run Full Pipeline Now
      </button>
    </form>
  </li>
  <li>
    <form method="post" action="{% url 'admin:index_scraperun_scrape_now' %}" style="display:inline">
      {% csrf_token %}
      <select name="region" style="padding:6px;border-radius:4px;margin-right:6px">
        <option value="">All markets</option>
        {% for region in regions %}
          <option value="{{ region.code }}">{{ region.name }} ({{ region.code }})</option>
        {% endfor %}
      </select>
      <button type="submit" class="button"
              style="padding:8px 14px;border-radius:4px;cursor:pointer"
              onclick="return confirm('Queue game scraping only (no discovery) for the selected market (or all markets if none is selected)?')">
        Run Game Scraping Now
      </button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
